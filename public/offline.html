<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E8" />
    <title>You’re offline — ARTISAN</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #F6F1E8; color: #2B2723; font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
      }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; line-height: 1.15; letter-spacing: -0.03em; margin: 0 0 0.75rem; }
      p { margin: 0; max-width: 22rem; line-height: 1.65; color: #6F675E; font-size: 0.95rem; }
      button {
        margin-top: 1.5rem;
        min-height: 2.75rem;
        padding: 0 1.15rem;
        border: 0;
        border-radius: 0.4rem;
        background: #2B2723;
        color: #FAF7F1;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline.</h1>
      <p>The marketplace needs a connection to show live products and prices. Saved pages may still open, but inventory is not current until you reconnect.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
